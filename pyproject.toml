[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-bakeoff"
version = "0.1.0"
description = "Repeated-run reliability of an LLM agent across screenshot, accessibility-tree and API interfaces"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "playwright>=1.45",
    "anthropic>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
